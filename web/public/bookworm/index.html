<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>書蟲養成 — 餵牠讀書，看牠長大</title>
<meta name="description" content="拍下書頁或餵牠文字重點，你的書蟲會依照讀過的內容慢慢長大、進化。">
<style>
  :root {
    --cream: #f7f4ed;
    --paper: #fffdf8;
    --ink: #1c1c1c;
    --ink-soft: #5f5f5d;
    --border: #e5e1d6;
    --coral: #e78b7a;
    --forest: #4f8341;
    --meadow: #f2d55a;
    --sky: #a9d8e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Heiti TC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100dvh; }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── header ── */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 2px 0; }
  header h1 { font-size: 20px; letter-spacing: -0.02em; }
  header h1 .sub { font-size: 12px; font-weight: 400; color: var(--ink-soft); margin-left: 8px; letter-spacing: 0; }
  #wormNameBtn {
    appearance: none; border: none; background: none; cursor: pointer;
    font-size: 14px; font-weight: 700; color: var(--ink);
    border-bottom: 1.5px dashed rgba(28,28,28,.35); padding-bottom: 1px;
  }

  /* ── scene ── */
  #scene {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    background:
      linear-gradient(to bottom, #fdfbf4 0%, #faf6ea 58%, #efe8d5 58%, #e9e1cc 100%);
    box-shadow: rgba(0,0,0,.05) 0 4px 18px;
  }
  /* bookshelf back wall */
  #shelf {
    position: absolute; inset: 0 0 42% 0;
    display: flex; align-items: flex-end; justify-content: center; gap: 5px;
    padding: 0 26px 0;
    opacity: .5;
    pointer-events: none;
  }
  #shelf .book { border-radius: 3px 3px 0 0; }
  #scene svg { display: block; width: 100%; height: auto; position: relative; }

  #bubble {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    max-width: 86%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    box-shadow: rgba(0,0,0,.10) 0 3px 8px;
    opacity: 0; translate: 0 -6px;
    transition: opacity .25s ease, translate .25s ease;
    pointer-events: none;
    z-index: 3;
  }
  #bubble.show { opacity: 1; translate: 0 0; }
  #bubble::after {
    content: ""; position: absolute; bottom: -7px; left: 50%; margin-left: -6px;
    width: 12px; height: 12px; background: var(--paper);
    border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
    transform: rotate(45deg);
  }
  #stageTag {
    position: absolute; right: 10px; top: 10px;
    background: rgba(28,28,28,.82); color: var(--cream);
    font-size: 11.5px; padding: 4px 10px; border-radius: 99px;
    letter-spacing: .05em;
    z-index: 2;
  }

  /* ── panels ── */
  .panel {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: rgba(0,0,0,.03) 0 2px 8px;
  }
  .panel h2 { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; letter-spacing: .08em; margin-bottom: 10px; }

  .barRow { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
  .barRow .lbl { flex: 0 0 4.4em; font-size: 13px; }
  .barRow .num { flex: 0 0 3.6em; text-align: right; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .track { flex: 1; height: 10px; border-radius: 99px; background: #eee9dc; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .fill.xp { background: linear-gradient(90deg, var(--coral), #d8694f); }
  .fill.food { background: linear-gradient(90deg, #b7d38f, var(--forest)); }

  #traits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--cream);
  }
  .chip.mut { border-color: rgba(231,139,122,.6); background: rgba(231,139,122,.12); }
  .statTrio { display: flex; gap: 8px; margin-top: 4px; }
  .statBox {
    flex: 1; text-align: center; background: var(--cream);
    border: 1px solid var(--border); border-radius: 12px; padding: 8px 4px 7px;
  }
  .statBox .v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .statBox .k { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }

  /* ── feed buttons ── */
  #feedBtns { display: flex; gap: 10px; }
  .feedBtn {
    flex: 1; appearance: none; cursor: pointer;
    border: none; border-radius: 14px;
    padding: 14px 8px 12px;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--cream);
    background: var(--ink);
    box-shadow: rgba(255,255,255,.2) 0 .5px 0 0 inset, rgba(0,0,0,.2) 0 0 0 .5px inset, rgba(0,0,0,.12) 0 2px 6px;
    transition: transform .08s ease, opacity .15s;
    line-height: 1.35;
  }
  .feedBtn small { display: block; font-size: 11px; font-weight: 400; opacity: .72; margin-top: 2px; }
  .feedBtn:active { transform: scale(.97); }
  .feedBtn:disabled { opacity: .45; cursor: default; }
  .feedBtn.photo { background: var(--forest); }

  /* ── log ── */
  #log { display: flex; flex-direction: column; gap: 8px; }
  .logItem { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
  .logItem .ico { flex: 0 0 auto; font-size: 15px; }
  .logItem .txt { flex: 1; color: var(--ink); overflow-wrap: anywhere; }
  .logItem .meta { color: var(--ink-soft); font-size: 11.5px; white-space: nowrap; }
  .empty { color: var(--ink-soft); font-size: 13px; }

  footer { text-align: center; padding-top: 4px; }
  footer button {
    appearance: none; border: none; background: none; cursor: pointer;
    color: var(--ink-soft); font-size: 12px; text-decoration: underline; text-underline-offset: 3px;
    font-family: inherit;
  }

  /* ── dialogs ── */
  dialog {
    border: 1.5px solid var(--ink);
    border-radius: 18px;
    padding: 20px;
    width: min(92vw, 440px);
    background: var(--paper);
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(28,28,28,.45); }
  dialog h3 { font-size: 17px; margin-bottom: 10px; letter-spacing: -0.01em; }
  dialog p.hint { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; line-height: 1.6; }
  dialog textarea {
    width: 100%; min-height: 130px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--cream); color: var(--ink);
    font-family: inherit; font-size: 14px; line-height: 1.7; padding: 10px 12px;
  }
  dialog textarea:focus { outline: 2px solid rgba(231,139,122,.55); }
  dialog input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    background: var(--cream); color: var(--ink);
    font-family: inherit; font-size: 15px; padding: 10px 12px;
  }
  .dlgBtns { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
  .dlgBtns button {
    appearance: none; cursor: pointer; font-family: inherit;
    border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--cream); color: var(--ink);
  }
  .dlgBtns button.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  /* evolution dialog */
  #evoDlg { text-align: center; }
  #evoDlg .big { font-size: 46px; margin: 6px 0 2px; }
  #evoDlg p { font-size: 14.5px; line-height: 1.7; margin: 8px 0; }
  #evoDlg .evoName { font-weight: 800; color: #c25a44; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
    background: rgba(28,28,28,.92); color: var(--cream);
    padding: 9px 18px; border-radius: 99px; font-size: 13.5px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: 88vw; text-align: center;
    z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* confetti-ish sparkles on evolution */
  @keyframes pop {
    0% { transform: translateY(0) scale(.4); opacity: 1; }
    100% { transform: translateY(-70px) scale(1.15); opacity: 0; }
  }
  .spark { position: absolute; font-size: 18px; animation: pop 1.1s ease-out forwards; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🐛 書蟲養成<span class="sub">餵牠讀書，看牠長大</span></h1>
    <button id="wormNameBtn" title="改名字">書蟲</button>
  </header>

  <section id="scene">
    <div id="shelf"></div>
    <div id="stageTag">蛋</div>
    <div id="bubble"></div>
    <svg id="wormSvg" viewBox="0 0 400 250" role="img" aria-label="你的書蟲"></svg>
  </section>

  <section id="feedBtns">
    <button class="feedBtn photo" id="photoBtn">📷 拍書頁給牠看<small>用相機拍下正在讀的頁面</small></button>
    <button class="feedBtn" id="textBtn">✍️ 餵牠文字重點<small>貼上你劃線的句子</small></button>
  </section>

  <section class="panel">
    <h2>成長狀態</h2>
    <div class="barRow">
      <span class="lbl">成長</span>
      <div class="track"><div class="fill xp" id="xpFill" style="width:0%"></div></div>
      <span class="num" id="xpNum">Lv.0</span>
    </div>
    <div class="barRow">
      <span class="lbl">飽足</span>
      <div class="track"><div class="fill food" id="foodFill" style="width:0%"></div></div>
      <span class="num" id="foodNum">0%</span>
    </div>
    <div class="statTrio">
      <div class="statBox"><div class="v" id="stWis">0</div><div class="k">智慧 📖</div></div>
      <div class="statBox"><div class="v" id="stEng">0</div><div class="k">活力 ⚡</div></div>
      <div class="statBox"><div class="v" id="stDiv">0</div><div class="k">見識 🔭</div></div>
    </div>
    <div id="traits"></div>
  </section>

  <section class="panel">
    <h2>閱讀日誌 · 牠吃過的書</h2>
    <div id="log"><div class="empty">還沒餵過任何東西。拍一頁書、或貼一段你劃線的句子吧！</div></div>
  </section>

  <footer><button id="resetBtn">重新孵一顆蛋（清除這隻書蟲）</button></footer>
</main>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<dialog id="textDlg">
  <h3>✍️ 餵牠文字重點</h3>
  <p class="hint">把你看書劃線的句子、筆記或任何一段文字貼進來。內容越有份量、詞彙越豐富，牠吃得越營養。</p>
  <textarea id="textInput" placeholder="例如：真正的發現之旅，不在於尋找新風景，而在於擁有新的眼光。"></textarea>
  <div class="dlgBtns">
    <button id="textCancel">取消</button>
    <button class="primary" id="textFeed">餵下去 🍽️</button>
  </div>
</dialog>

<dialog id="nameDlg">
  <h3>幫你的書蟲取個名字</h3>
  <input type="text" id="nameInput" maxlength="12" placeholder="例如：阿墨、小蠹、Page…">
  <div class="dlgBtns">
    <button id="nameCancel">取消</button>
    <button class="primary" id="nameSave">就叫這個！</button>
  </div>
</dialog>

<dialog id="evoDlg">
  <div class="big" id="evoEmoji">✨</div>
  <h3 id="evoTitle">進化了！</h3>
  <p id="evoDesc"></p>
  <div class="dlgBtns" style="justify-content:center">
    <button class="primary" id="evoOk">太棒了！</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   書蟲養成 Bookworm Tamagotchi
   純前端、零依賴。存檔在 localStorage（每個瀏覽器一隻蟲）。
   ============================================================ */

const SAVE_KEY = 'bookwormSaveV1';
const $ = (id) => document.getElementById(id);

/* ── 存檔 ── */
function defaultState() {
  return {
    name: '書蟲',
    stage: 'egg',              // egg | larva | teen | cocoon | adult
    xp: 0,
    level: 0,
    cocoonFeedsLeft: 0,
    satiety: 60,               // 0-100，隨真實時間下降
    lastTick: Date.now(),
    hue: 96, sat: 48,          // 身體顏色，會被餵的內容慢慢染色
    stats: { wis: 0, eng: 0, div: 0 },
    mutations: [],             // ['wings','antenna2','glasses','spots','stripes','taillight','blush']
    feeds: [],                 // {type,summary,xp,t}
    fedHashes: [],             // 防止同一段文字重複灌食
    born: Date.now(),
  };
}
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) { /* 壞檔就重來 */ }
  return defaultState();
}
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }

/* ── 等級曲線 ── */
function xpForLevel(l) { return Math.round(20 * l + 8 * l * l); }  // Lv1=28, Lv2=72, Lv3=132 … Lv6=408（約 20 次餵食可羽化）
function levelFromXp(xp) { let l = 0; while (xpForLevel(l + 1) <= xp) l++; return l; }

/* ── 種子隨機（由餵食內容決定，讓每隻蟲因「吃的書」不同而走上不同路）── */
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── 文字分析：長度→營養、詞彙多樣性→智慧、標點→活力、混合語言→見識 ── */
function analyzeText(text) {
  const t = text.trim();
  const len = [...t].length;
  const unique = new Set([...t.replace(/\s/g, '')]).size;
  const uniqRatio = len ? unique / Math.min(len, 120) : 0;
  const cjk = (t.match(/[一-鿿㐀-䶿]/g) || []).length;
  const latin = (t.match(/[a-zA-Z]/g) || []).length;
  const excl = (t.match(/[!！?？~～]/g) || []).length;
  const mixed = cjk > 0 && latin > 0;

  const xp = Math.max(6, Math.min(32, Math.round(6 + Math.sqrt(len) * 1.6)));
  const wis = Math.min(5, Math.round(uniqRatio * 6 + len / 120));
  const eng = Math.min(5, 1 + excl);
  const div = Math.min(5, (mixed ? 2 : 0) + Math.round(uniqRatio * 3));

  // 文字內容輕輕染色：以字元雜湊決定色相偏移方向
  const hueNudge = ((hashStr(t) % 41) - 20) * 0.35;

  let flavor;
  if (len > 140) flavor = '這段重點份量十足，牠嚼了好久好久…吃得超飽！';
  else if (mixed) flavor = '中英夾雜的句子！牠覺得見識到了新世界。';
  else if (excl >= 2) flavor = '好熱血的句子！牠興奮得扭來扭去。';
  else if (uniqRatio > 0.8) flavor = '詞彙好豐富，牠說這是山珍海味。';
  else flavor = '牠慢慢咀嚼著這段文字，露出滿足的表情。';

  return { xp, wis, eng, div, hueNudge, flavor, len };
}

/* ── 照片分析：亮度 + 邊緣密度（估「像不像一頁字」）+ 主色調 ── */
function analyzeImage(img) {
  const W = 64, H = 64;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;

  let sumL = 0, edge = 0;
  let hx = 0, hy = 0, satSum = 0, satCount = 0;
  const lum = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const l = 0.299 * r + 0.587 * g + 0.114 * b;
    lum[i] = l; sumL += l;
    // 色相統計（只看有彩度的像素）
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx === 0 ? 0 : (mx - mn) / mx;
    if (sat > 0.18 && mx > 40) {
      let h;
      if (mx === mn) h = 0;
      else if (mx === r) h = 60 * (((g - b) / (mx - mn)) % 6);
      else if (mx === g) h = 60 * ((b - r) / (mx - mn) + 2);
      else h = 60 * ((r - g) / (mx - mn) + 4);
      if (h < 0) h += 360;
      const rad = h * Math.PI / 180;
      hx += Math.cos(rad); hy += Math.sin(rad);
      satSum += sat; satCount++;
    }
  }
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W - 1; x++)
      edge += Math.abs(lum[y * W + x] - lum[y * W + x + 1]);

  const avgL = sumL / (W * H) / 255;                       // 0-1
  const edgeD = Math.min(1, edge / (W * H) / 22);          // 0-1，書頁文字通常 >0.4
  const pageScore = avgL * 0.4 + edgeD * 0.6;              // 「像書頁」程度
  let domHue = null, domSat = 0;
  if (satCount > W * H * 0.06) {                           // 有足夠的彩色面積才算主色
    domHue = (Math.atan2(hy, hx) * 180 / Math.PI + 360) % 360;
    domSat = satSum / satCount;
  }

  const xp = Math.max(8, Math.min(34, Math.round(8 + pageScore * 26)));
  const wis = edgeD > 0.45 ? 3 : 1;                        // 字越密越補智慧
  const eng = avgL > 0.62 ? 2 : 1;
  const div = domHue !== null ? 3 : 1;                     // 彩色書頁（圖鑑、繪本）補見識

  let flavor;
  if (edgeD > 0.5 && avgL > 0.55) flavor = '哇，這一頁的字好密！牠狼吞虎嚥地啃完了。';
  else if (avgL < 0.3) flavor = '這頁好暗…你是在被窩裡偷看書嗎？牠瞇著眼睛啃。';
  else if (domHue !== null) flavor = '有彩色的頁面！牠邊吃邊染上了一點新顏色。';
  else flavor = '牠沿著字裡行間慢慢爬過，把這一頁啃出了一個小洞。';

  return { xp, wis, eng, div, domHue, domSat, dark: avgL < 0.3, flavor };
}

/* ── 突變（進化特徵）── */
const MUTATIONS = {
  antenna2:  { name: '第二對觸角', emoji: '📡', desc: '智慧滿溢，頭上多長出了一對觸角，據說收得到書的頻率。' },
  glasses:   { name: '小圓眼鏡',   emoji: '👓', desc: '讀太多字，牠給自己配了一副小圓眼鏡，看起來博學極了。' },
  spots:     { name: '墨水斑點',   emoji: '🎨', desc: '見識廣了，身上浮出一顆顆墨水般的斑點。' },
  stripes:   { name: '書背條紋',   emoji: '📚', desc: '身上長出像精裝書書背一樣的條紋，超有氣質。' },
  blush:     { name: '興奮紅暈',   emoji: '😊', desc: '活力充沛，臉頰泛起了永遠的紅暈。' },
  taillight: { name: '夜讀尾燈',   emoji: '💡', desc: '陪你在暗處讀書太多次，尾巴亮起了一盞小燈。' },
  wings:     { name: '一對翅膀',   emoji: '🦋', desc: '破蛹而出——牠羽化了！背上多了一對會撲動的翅膀。' },
};
function rollMutation(seedStr) {
  const rnd = mulberry32(hashStr(seedStr + '|' + S.level));
  // 依屬性加權：吃什麼像什麼
  const pool = [];
  const add = (k, w) => { if (!S.mutations.includes(k)) for (let i = 0; i < w; i++) pool.push(k); };
  add('antenna2', 1 + S.stats.wis);
  add('glasses', S.stats.wis >= 8 ? 2 + S.stats.wis : 1);
  add('spots', 1 + S.stats.div);
  add('stripes', 1 + Math.floor(S.stats.div / 2));
  add('blush', 1 + S.stats.eng);
  if (S.feeds.some(f => f.dark)) add('taillight', 4);
  if (!pool.length) return null;
  return pool[Math.floor(rnd() * pool.length)];
}

/* ── 階段機 ── */
const STAGE_NAME = { egg: '蛋', larva: '幼蟲', teen: '少年蟲', cocoon: '蛹', adult: '成蟲' };
function stageForLevel(l) { return l <= 2 ? 'larva' : l <= 5 ? 'teen' : 'adult'; }

/* ── 餵食主流程 ── */
function feed(kind, analysis, summary) {
  tickSatiety();
  const wasStage = S.stage, wasLevel = S.level;

  S.xp += analysis.xp;
  S.satiety = Math.min(100, S.satiety + analysis.xp * 1.3);
  S.stats.wis += analysis.wis;
  S.stats.eng += analysis.eng;
  S.stats.div += analysis.div;

  // 染色：文字輕推、彩色照片較大力
  if (kind === 'photo' && analysis.domHue !== null) {
    const target = analysis.domHue;
    let diff = ((target - S.hue + 540) % 360) - 180;
    S.hue = (S.hue + diff * 0.25 + 360) % 360;
    S.sat = Math.max(30, Math.min(70, S.sat + (analysis.domSat * 100 - S.sat) * 0.15));
  } else if (analysis.hueNudge) {
    S.hue = (S.hue + analysis.hueNudge + 360) % 360;
  }

  S.feeds.unshift({ type: kind, summary, xp: analysis.xp, t: Date.now(), dark: !!analysis.dark });
  if (S.feeds.length > 30) S.feeds.length = 30;

  const events = [];  // 進化事件排隊播

  // 孵化
  if (S.stage === 'egg') {
    S.stage = 'larva';
    events.push({ emoji: '🐣', title: `${S.name} 孵化了！`, desc: '一隻小小的書蟲從蛋裡鑽了出來，眨著眼睛等你餵牠更多書。' });
  }

  // 蛹期：每餵一次消化一次
  if (S.stage === 'cocoon') {
    S.cocoonFeedsLeft--;
    if (S.cocoonFeedsLeft <= 0) {
      S.stage = 'adult';
      if (!S.mutations.includes('wings')) S.mutations.push('wings');
      events.push({ emoji: '🦋', title: `${S.name} 羽化了！！`, desc: MUTATIONS.wings.desc + ' 牠現在是一隻讀萬卷書的成蟲了。' });
    }
  }

  // 升級
  const newLevel = levelFromXp(S.xp);
  if (newLevel > S.level) {
    S.level = newLevel;
    // 進入蛹期的門檻
    if (S.stage !== 'cocoon' && S.stage !== 'adult' && newLevel >= 6) {
      S.stage = 'cocoon';
      S.cocoonFeedsLeft = 3;
      events.push({ emoji: '🪺', title: `${S.name} 結蛹了…`, desc: '牠把自己捲進了書頁做的蛹裡。再餵牠 3 次，見證羽化的時刻吧！' });
    } else if (S.stage !== 'cocoon') {
      if (S.stage !== 'adult') S.stage = stageForLevel(newLevel);
      // 升級時擲一次突變骰（吃什麼像什麼）
      const mut = rollMutation(summary);
      if (mut && wasLevel > 0) {
        S.mutations.push(mut);
        const m = MUTATIONS[mut];
        events.push({ emoji: m.emoji, title: `長出了「${m.name}」！`, desc: m.desc });
      } else if (S.stage !== wasStage) {
        events.push({ emoji: '✨', title: `升級成${STAGE_NAME[S.stage]}了！`, desc: `${S.name} 長大了一圈，身體多了一節。` });
      }
    }
  }

  save();
  renderUI();
  speak(analysis.flavor);
  chompAnim();
  playEvents(events);
}

/* 事件排隊播放（孵化→升級→突變 可能同時發生） */
function playEvents(events) {
  if (!events.length) return;
  const e = events.shift();
  $('evoEmoji').textContent = e.emoji;
  $('evoTitle').textContent = e.title;
  $('evoDesc').textContent = e.desc;
  const dlg = $('evoDlg');
  dlg.showModal();
  sparkle();
  $('evoOk').onclick = () => { dlg.close(); setTimeout(() => playEvents(events), 250); };
}

function sparkle() {
  const scene = $('scene');
  const icons = ['✨', '📖', '⭐', '💫'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = icons[i % icons.length];
    s.style.left = (10 + Math.random() * 80) + '%';
    s.style.top = (30 + Math.random() * 50) + '%';
    s.style.animationDelay = (Math.random() * 0.5) + 's';
    scene.appendChild(s);
    setTimeout(() => s.remove(), 1800);
  }
}

/* ── 飽足度隨真實時間下降（24 小時掉 100）── */
function tickSatiety() {
  const now = Date.now();
  const hours = (now - S.lastTick) / 3600000;
  if (hours > 0.01) {
    S.satiety = Math.max(0, S.satiety - hours * (100 / 24));
    S.lastTick = now;
    save();
  }
}

/* ── 對話泡泡 ── */
let bubbleTimer = null;
function speak(text, ms = 4200) {
  const b = $('bubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('show'), ms);
}

/* ── 吃東西的動畫觸發 ── */
let chompUntil = 0;
function chompAnim() { chompUntil = performance.now() + 1600; }

/* ============================================================
   SVG 蟲蟲渲染器 — 依狀態程序化生成
   ============================================================ */
const svg = $('wormSvg');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function bodyColor(lightOffset = 0) {
  return `hsl(${Math.round(S.hue)}, ${Math.round(S.sat)}%, ${58 + lightOffset}%)`;
}
function bodyDark(lightOffset = 0) {
  return `hsl(${Math.round(S.hue)}, ${Math.round(S.sat)}%, ${36 + lightOffset}%)`;
}

function mood() {
  if (S.stage === 'egg' || S.stage === 'cocoon') return 'calm';
  if (S.satiety < 12) return 'sleepy';
  if (S.satiety < 35) return 'hungry';
  if (S.satiety > 72) return 'happy';
  return 'ok';
}

let blinkAt = 0;
function render(now) {
  const t = now / 1000;
  svg.textContent = '';

  // 地面陰影
  svg.appendChild(el('ellipse', { cx: 200, cy: 212, rx: 110, ry: 14, fill: 'rgba(28,28,28,.10)' }));

  if (S.stage === 'egg') { renderEgg(t); requestAnimationFrame(render); return; }
  if (S.stage === 'cocoon') { renderCocoon(t); requestAnimationFrame(render); return; }

  const m = mood();
  const chomping = performance.now() < chompUntil;
  const level = S.level;
  const segN = Math.min(8, 3 + Math.floor(level / 1.5));      // 身體節數隨等級
  const headR = 24 + Math.min(10, level * 1.2);               // 頭隨等級變大
  const speed = m === 'sleepy' ? 0.9 : m === 'happy' ? 2.4 : 1.6;
  const amp = m === 'sleepy' ? 3 : chomping ? 10 : 7;

  // 由尾到頭排座標（頭在右）
  const headX = 278, baseY = 185;
  const seg = [];
  for (let i = 0; i < segN; i++) {
    const r = i === 0 ? headR : Math.max(10, headR - 4 - i * 1.8);
    const x = headX - i * (r * 1.35);
    const y = baseY - r * 0.55 + Math.sin(t * speed + i * 0.9) * amp * (i === 0 ? 0.5 : 1);
    seg.push({ x, y, r });
  }

  // 翅膀（畫在身體後面）
  if (S.mutations.includes('wings')) {
    const flap = Math.sin(t * 6) * 14;
    const wx = seg[Math.min(1, segN - 1)].x, wy = seg[Math.min(1, segN - 1)].y - 8;
    for (const side of [-1, 1]) {
      const g = el('g', { transform: `translate(${wx},${wy}) rotate(${(-32 + flap) * side}) ` });
      const w = el('ellipse', {
        cx: -6 * side, cy: -34, rx: 17, ry: 36,
        fill: 'rgba(255,255,255,.82)', stroke: bodyDark(), 'stroke-width': 2,
      });
      g.appendChild(w);
      g.appendChild(el('ellipse', { cx: -6 * side, cy: -26, rx: 8, ry: 18, fill: `hsla(${Math.round(S.hue)},60%,80%,.7)` }));
      svg.appendChild(g);
    }
  }

  // 身體（尾到頭畫，頭蓋在最上面）
  for (let i = segN - 1; i >= 0; i--) {
    const s = seg[i];
    svg.appendChild(el('circle', { cx: s.x, cy: s.y, r: s.r, fill: bodyColor(i === 0 ? 4 : 0), stroke: bodyDark(), 'stroke-width': 2.5 }));
    // 肚皮高光
    svg.appendChild(el('ellipse', { cx: s.x - s.r * 0.25, cy: s.y - s.r * 0.35, rx: s.r * 0.32, ry: s.r * 0.22, fill: 'rgba(255,255,255,.35)' }));
    // 條紋
    if (S.mutations.includes('stripes') && i > 0) {
      svg.appendChild(el('path', {
        d: `M ${s.x - s.r * 0.7} ${s.y - s.r * 0.5} Q ${s.x} ${s.y - s.r * 1.05} ${s.x + s.r * 0.7} ${s.y - s.r * 0.5}`,
        fill: 'none', stroke: bodyDark(-6), 'stroke-width': 3.5, 'stroke-linecap': 'round',
      }));
    }
    // 斑點
    if (S.mutations.includes('spots') && i > 0) {
      const rnd = mulberry32(i * 999 + 7);
      for (let k = 0; k < 2; k++) {
        svg.appendChild(el('circle', {
          cx: s.x + (rnd() - 0.5) * s.r, cy: s.y + (rnd() - 0.6) * s.r * 0.8,
          r: 2.2 + rnd() * 2, fill: bodyDark(-4), opacity: 0.75,
        }));
      }
    }
    // 小腳
    if (i > 0) {
      for (const side of [-0.45, 0.45]) {
        svg.appendChild(el('line', {
          x1: s.x + side * s.r, y1: s.y + s.r * 0.8,
          x2: s.x + side * s.r * 1.3, y2: s.y + s.r * 1.15 + Math.sin(t * speed * 2 + i) * 2,
          stroke: bodyDark(), 'stroke-width': 3, 'stroke-linecap': 'round',
        }));
      }
    }
  }

  // 夜讀尾燈
  if (S.mutations.includes('taillight')) {
    const tail = seg[segN - 1];
    const glow = 0.55 + Math.sin(t * 3) * 0.25;
    svg.appendChild(el('circle', { cx: tail.x - tail.r * 0.9, cy: tail.y - tail.r * 0.9, r: 9, fill: `rgba(242,213,90,${glow * 0.35})` }));
    svg.appendChild(el('circle', { cx: tail.x - tail.r * 0.9, cy: tail.y - tail.r * 0.9, r: 4.5, fill: '#f2d55a', stroke: '#b89a1e', 'stroke-width': 1.5, opacity: glow + 0.3 }));
  }

  /* ── 頭部細節 ── */
  const hd = seg[0];
  // 觸角
  const antSets = S.mutations.includes('antenna2') ? [[-0.5, -1.15], [-0.15, -1.3], [0.2, -1.2], [0.55, -1.05]] : [[-0.35, -1.2], [0.35, -1.2]];
  for (const [dx] of antSets.map((a, idx) => [a[0], idx])) {
    const wob = Math.sin(t * speed + dx * 5) * 4;
    const ax = hd.x + dx * hd.r, ay = hd.y - hd.r * 0.85;
    const tipX = ax + dx * 14 + wob, tipY = ay - hd.r * 0.75;
    svg.appendChild(el('path', {
      d: `M ${ax} ${ay} Q ${ax + dx * 6} ${ay - hd.r * 0.6} ${tipX} ${tipY}`,
      fill: 'none', stroke: bodyDark(), 'stroke-width': 3, 'stroke-linecap': 'round',
    }));
    svg.appendChild(el('circle', { cx: tipX, cy: tipY, r: 4, fill: bodyColor(10), stroke: bodyDark(), 'stroke-width': 2 }));
  }

  // 眨眼
  if (now > blinkAt) blinkAt = now + 2200 + Math.random() * 3000;
  const blinking = blinkAt - now < 140 || m === 'sleepy';
  const eyeY = hd.y - hd.r * 0.18;
  for (const side of [-1, 1]) {
    const ex = hd.x + side * hd.r * 0.38;
    if (blinking) {
      svg.appendChild(el('path', { d: `M ${ex - 5} ${eyeY} Q ${ex} ${eyeY + 3} ${ex + 5} ${eyeY}`, stroke: '#1c1c1c', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }));
    } else {
      svg.appendChild(el('circle', { cx: ex, cy: eyeY, r: 6.5, fill: '#fff', stroke: '#1c1c1c', 'stroke-width': 1.5 }));
      svg.appendChild(el('circle', { cx: ex + 1.5, cy: eyeY + 1, r: 3.2, fill: '#1c1c1c' }));
      svg.appendChild(el('circle', { cx: ex + 2.6, cy: eyeY - 0.5, r: 1.1, fill: '#fff' }));
    }
  }
  // 眼鏡
  if (S.mutations.includes('glasses')) {
    for (const side of [-1, 1]) {
      svg.appendChild(el('circle', { cx: hd.x + side * hd.r * 0.38, cy: eyeY, r: 9.5, fill: 'rgba(255,255,255,.15)', stroke: '#4a3b2a', 'stroke-width': 2.2 }));
    }
    svg.appendChild(el('line', { x1: hd.x - hd.r * 0.38 + 9.5, y1: eyeY, x2: hd.x + hd.r * 0.38 - 9.5, y2: eyeY, stroke: '#4a3b2a', 'stroke-width': 2.2 }));
  }
  // 紅暈
  if (S.mutations.includes('blush') || m === 'happy') {
    for (const side of [-1, 1]) {
      svg.appendChild(el('ellipse', { cx: hd.x + side * hd.r * 0.62, cy: hd.y + hd.r * 0.18, rx: 5.5, ry: 3.5, fill: 'rgba(231,139,122,.55)' }));
    }
  }
  // 嘴巴（吃東西時大口咀嚼）
  const mouthY = hd.y + hd.r * 0.32;
  if (chomping) {
    const open = (Math.sin(t * 14) + 1) / 2;
    svg.appendChild(el('ellipse', { cx: hd.x, cy: mouthY, rx: 7, ry: 2 + open * 6, fill: '#7c3a2d' }));
  } else if (m === 'hungry' || m === 'sleepy') {
    svg.appendChild(el('path', { d: `M ${hd.x - 7} ${mouthY + 3} Q ${hd.x} ${mouthY - 3} ${hd.x + 7} ${mouthY + 3}`, stroke: '#1c1c1c', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }));
  } else {
    svg.appendChild(el('path', { d: `M ${hd.x - 7} ${mouthY - 1} Q ${hd.x} ${mouthY + 5} ${hd.x + 7} ${mouthY - 1}`, stroke: '#1c1c1c', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }));
  }
  // 想睡的 zzz
  if (m === 'sleepy') {
    const zt = el('text', { x: hd.x + hd.r + 8, y: hd.y - hd.r - 4, 'font-size': 16, fill: '#5f5f5d' });
    zt.textContent = 'z z…';
    svg.appendChild(zt);
  }

  requestAnimationFrame(render);
}

function renderEgg(t) {
  const wob = Math.sin(t * 2.2) * 2.5;
  const g = el('g', { transform: `translate(200,168) rotate(${wob})` });
  g.appendChild(el('path', {
    d: 'M 0 -46 C 26 -46 40 -18 40 8 C 40 34 22 48 0 48 C -22 48 -40 34 -40 8 C -40 -18 -26 -46 0 -46 Z',
    fill: '#fdf8ec', stroke: '#c9bfa5', 'stroke-width': 3,
  }));
  // 蛋上的書本花紋
  g.appendChild(el('text', Object.assign({ x: -11, y: 12, 'font-size': 22 })));
  const bookIcon = g.lastChild; bookIcon.textContent = '📖';
  for (let i = 0; i < 4; i++) {
    const rnd = mulberry32(i * 31 + 5);
    g.appendChild(el('circle', { cx: (rnd() - 0.5) * 56, cy: (rnd() - 0.5) * 70, r: 2.5, fill: '#d9cfb2' }));
  }

  const hint = el('text', { x: 200, y: 236, 'text-anchor': 'middle', 'font-size': 13, fill: '#5f5f5d' });
  hint.textContent = '餵牠第一口書，牠就會孵化 👇';
  svg.appendChild(hint);
}

function renderCocoon(t) {
  const jig = Math.sin(t * 5) * (performance.now() < chompUntil ? 4 : 1.2);
  const g = el('g', { transform: `translate(${200 + jig},158)` });
  g.appendChild(el('path', {
    d: 'M 0 -52 C 30 -50 42 -16 40 12 C 38 42 20 56 0 56 C -20 56 -38 42 -40 12 C -42 -16 -30 -50 0 -52 Z',
    fill: bodyColor(18), stroke: bodyDark(), 'stroke-width': 3,
  }));
  // 絲線（像書頁一樣一圈圈）
  for (let i = -1; i <= 2; i++) {
    g.appendChild(el('path', {
      d: `M -39 ${i * 22 - 8} Q 0 ${i * 22 + 4} 39 ${i * 22 - 8}`,
      fill: 'none', stroke: bodyDark(8), 'stroke-width': 2, opacity: 0.5,
    }));
  }
  // 一雙眼睛從縫裡偷看
  g.appendChild(el('circle', { cx: -8, cy: -6, r: 3, fill: '#1c1c1c' }));
  g.appendChild(el('circle', { cx: 8, cy: -6, r: 3, fill: '#1c1c1c' }));
  svg.appendChild(g);
  const hint = el('text', { x: 200, y: 238, 'text-anchor': 'middle', 'font-size': 13, fill: '#5f5f5d' });
  hint.textContent = `再餵 ${S.cocoonFeedsLeft} 次就會羽化…`;
  svg.appendChild(hint);
}

/* ============================================================
   UI
   ============================================================ */
function renderUI() {
  $('wormNameBtn').textContent = `${S.name} ✎`;
  $('stageTag').textContent = `${STAGE_NAME[S.stage]} · Lv.${S.level}`;

  const cur = xpForLevel(S.level), next = xpForLevel(S.level + 1);
  const pct = Math.min(100, Math.round(((S.xp - cur) / (next - cur)) * 100));
  $('xpFill').style.width = (S.stage === 'egg' ? 0 : pct) + '%';
  $('xpNum').textContent = `Lv.${S.level}`;
  $('foodFill').style.width = Math.round(S.satiety) + '%';
  $('foodNum').textContent = Math.round(S.satiety) + '%';
  $('stWis').textContent = S.stats.wis;
  $('stEng').textContent = S.stats.eng;
  $('stDiv').textContent = S.stats.div;

  // 特徵 chips
  const traits = $('traits');
  traits.textContent = '';
  const stageChip = document.createElement('span');
  stageChip.className = 'chip';
  stageChip.textContent = `目前型態：${STAGE_NAME[S.stage]}`;
  traits.appendChild(stageChip);
  for (const mKey of S.mutations) {
    const m = MUTATIONS[mKey]; if (!m) continue;
    const c = document.createElement('span');
    c.className = 'chip mut';
    c.textContent = `${m.emoji} ${m.name}`;
    c.title = m.desc;
    traits.appendChild(c);
  }

  // 日誌
  const log = $('log');
  log.textContent = '';
  if (!S.feeds.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '還沒餵過任何東西。拍一頁書、或貼一段你劃線的句子吧！';
    log.appendChild(e);
  } else {
    for (const f of S.feeds.slice(0, 8)) {
      const row = document.createElement('div');
      row.className = 'logItem';
      const ico = document.createElement('span'); ico.className = 'ico';
      ico.textContent = f.type === 'photo' ? '📷' : '✍️';
      const txt = document.createElement('span'); txt.className = 'txt';
      txt.textContent = f.summary;
      const meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = `+${f.xp} · ${timeAgo(f.t)}`;
      row.append(ico, txt, meta);
      log.appendChild(row);
    }
  }
}
function timeAgo(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return '剛剛';
  if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
  return Math.floor(s / 86400) + ' 天前';
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

$('textBtn').addEventListener('click', () => {

$('textCancel').addEventListener('click', () => $('textDlg').close());
$('textFeed').addEventListener('click', () => {

  const h = String(hashStr(text));
  const a = analyzeText(text);
  if (S.fedHashes.includes(h)) {
    a.xp = Math.max(2, Math.round(a.xp * 0.2));
    a.wis = 0; a.eng = 0; a.div = 0;
    a.flavor = '咦，這段牠好像吃過了…牠意思意思咬了兩口。';
  } else {
    S.fedHashes.push(h);
    if (S.fedHashes.length > 200) S.fedHashes.shift();
  }
  const summary = [...text].length > 26 ? [...text].slice(0, 26).join('') + '…' : text;
  feed('text', a, summary);
});

// 照片餵食
$('photoBtn').addEventListener('click', () => $('photoInput').click());
$('photoInput').addEventListener('change', () => {
  const file = $('photoInput').files[0];
  $('photoInput').value = '';
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    try {
      const a = analyzeImage(img);
      feed('photo', a, '一頁書的照片');
    } catch (e) {
      toast('這張照片讀不進去，換一張試試？');
    }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('這張照片打不開，換一張試試？'); };
  img.src = url;
});

// 改名
$('wormNameBtn').addEventListener('click', () => {
  $('nameInput').value = S.name;
  $('nameDlg').showModal();
  setTimeout(() => $('nameInput').select(), 60);
});
$('nameCancel').addEventListener('click', () => $('nameDlg').close());
$('nameSave').addEventListener('click', () => {
  const n = $('nameInput').value.trim();
  if (n) { S.name = n; save(); renderUI(); speak(`我叫 ${n}！請多指教 🐛`); }
  $('nameDlg').close();
});

// 重置
$('resetBtn').addEventListener('click', () => {
  if (confirm(`確定要跟 ${S.name} 說再見、重新孵一顆蛋嗎？\n（這隻蟲的所有成長紀錄會消失）`)) {
    localStorage.removeItem(SAVE_KEY);
    S = defaultState();
    save();
    renderUI();
    speak('（一顆新的蛋靜靜躺在這裡…）');
  }
});

// 點蟲蟲會害羞
$('scene').addEventListener('click', () => {
  if (S.stage === 'egg') { speak('（蛋輕輕晃了一下）'); chompAnim(); return; }
  if (S.stage === 'cocoon') { speak('（蛹裡傳來窸窸窣窣的聲音…）'); chompAnim(); return; }
  const lines = mood() === 'hungry'
    ? ['肚子好餓…餵我讀點什麼吧 🥺', '好想吃一段好句子…', '今天還沒讀書嗎？']
    : ['嘿嘿，你在看我嗎？', `我已經吃了 ${S.feeds.length} 頓書了！`, '下一本要讀什麼？', '字太少的書不夠塞牙縫！'];
  speak(lines[Math.floor(Math.random() * lines.length)]);
});

/* ── 啟動 ── */
tickSatiety();
setInterval(() => { tickSatiety(); renderUI(); }, 60000);
renderUI();
requestAnimationFrame(render);
if (S.stage === 'egg' && !S.feeds.length) {
  setTimeout(() => speak('一顆有書香味的蛋… 餵牠一點文字或拍頁書給牠吧！'), 600);
}
</script>
</body>
</html>
